<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Task Manager</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>

  <body class="min-h-screen bg-slate-100 text-slate-800">
    <main class="mx-auto max-w-7xl px-4 py-6 sm:px-6 lg:px-8 lg:py-10">
      <!-- Header -->
      <header
        class="mb-8 flex flex-col gap-2 sm:flex-row sm:items-center sm:justify-between"
      >
        <div>
          <h1 class="text-xl font-bold tracking-tight sm:text-3xl">
            Task Manager
          </h1>
          <p class="mt-1 text-xs sm:text-sm text-slate-500">
            Organize your tasks and stay productive.
          </p>
        </div>

        <div
          class="mt-2 flex items-center gap-2 text-xs sm:text-sm text-slate-500 sm:mt-0"
        >
          <span class="h-2 w-2 rounded-full bg-green-500"></span>
          Personal Workspace
        </div>
      </header>

      <!-- Main Layout -->
      <div
        class="grid grid-cols-1 items-start gap-6 lg:grid-cols-[340px_minmax(0,1fr)]"
      >
        <!-- Add Task Form -->
        <section
          class="rounded-2xl border border-slate-200 bg-white p-5 shadow-sm sm:p-6"
        >
          <div class="mb-6">
            <h2 class="sm:text-lg text-base font-semibold">Create a Task</h2>
            <p class="mt-1 text-xs sm:text-sm text-slate-500">
              Add a new task to your list.
            </p>
          </div>

          <form id="taskForm" class="space-y-5">
            <div>
              <label
                for="taskTitle"
                class="mb-2 block text-xs sm:text-sm font-medium"
              >
                Task Title <span class="text-red-500">*</span>
              </label>
              <input
                type="text"
                id="taskTitle"
                maxlength="100"
                required
                placeholder="What needs to be done?"
                class="w-full rounded-lg border border-slate-200 bg-slate-50 px-3 sm:px-3.5 py-2 sm:py-3 text-xs sm:text-sm outline-none transition focus:border-blue-500 focus:bg-white focus:ring-2 focus:ring-blue-100"
              />
            </div>

            <div>
              <label
                for="taskDescription"
                class="mb-2 block text-xs sm:text-sm font-medium"
              >
                Description
              </label>
              <textarea
                id="taskDescription"
                maxlength="500"
                rows="4"
                placeholder="Add some details..."
                class="w-full resize-y rounded-lg border border-slate-200 bg-slate-50 px-3 sm:px-3.5 py-2 sm:py-3 text-xs sm:text-sm outline-none transition focus:border-blue-500 focus:bg-white focus:ring-2 focus:ring-blue-100"
              ></textarea>
            </div>

            <div>
              <label
                for="taskPriority"
                class="mb-2 block text-xs sm:text-sm font-medium"
              >
                Priority
              </label>
              <select
                id="taskPriority"
                class="w-full rounded-lg border border-slate-200 bg-slate-50 px-3 sm:px-3.5 py-2 sm:py-3 text-xs sm:text-sm outline-none focus:border-blue-500 focus:bg-white focus:ring-2 focus:ring-blue-100"
              >
                <option value="Low">Low</option>
                <option value="Medium" selected>Medium</option>
                <option value="High">High</option>
              </select>
            </div>

            <div>
              <label
                for="taskStatus"
                class="mb-2 block text-xs sm:text-sm font-medium"
              >
                Status
              </label>
              <select
                id="taskStatus"
                class="w-full rounded-lg border border-slate-200 bg-slate-50 px-3 sm:px-3.5 py-2 sm:py-3 text-xs sm:text-sm outline-none focus:border-blue-500 focus:bg-white focus:ring-2 focus:ring-blue-100"
              >
                <option value="Pending" selected>Pending</option>
                <option value="In Progress">In Progress</option>
                <option value="Completed">Completed</option>
              </select>
            </div>

            <button
              type="submit"
              id="submitBtn"
              class="w-full rounded-lg bg-blue-600 px-3 sm:px-3.5 py-2 sm:py-3 text-xs sm:text-sm font-semibold text-white transition hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-300 focus:ring-offset-2"
            >
              + Add Task
            </button>
          </form>
        </section>

        <!-- Task List Section -->
        <section
          class="min-w-0 rounded-2xl border border-slate-200 bg-white p-5 shadow-sm sm:p-6"
        >
          <div class="mb-6">
            <h2 class="sm:text-lg text-base font-semibold">My Tasks</h2>
            <p class="mt-1 text-xs sm:text-sm text-slate-500">
              View and manage all your tasks.
            </p>
          </div>

          <!-- Search and Filters -->
          <div
            class="mb-5 grid grid-cols-1 gap-3 sm:grid-cols-2 xl:grid-cols-3"
          >
            <input
              type="search"
              id="searchTask"
              placeholder="Search tasks..."
              class="min-w-0 rounded-lg border border-slate-200 bg-slate-50 px-3 sm:px-3.5 py-2 sm:py-3 text-xs sm:text-sm outline-none focus:border-blue-500 focus:bg-white focus:ring-2 focus:ring-blue-100 sm:col-span-2 xl:col-span-1"
            />

            <select
              id="statusFilter"
              class="min-w-0 rounded-lg border border-slate-200 bg-slate-50 px-3 sm:px-3.5 py-2 sm:py-3 text-xs sm:text-sm outline-none focus:border-blue-500 focus:bg-white focus:ring-2 focus:ring-blue-100"
            >
              <option value="All">All Status</option>
              <option value="Pending">Pending</option>
              <option value="In Progress">In Progress</option>
              <option value="Completed">Completed</option>
            </select>

            <select
              id="priorityFilter"
              class="min-w-0 rounded-lg border border-slate-200 bg-slate-50 px-3 sm:px-3.5 py-2 sm:py-3 text-xs sm:text-sm outline-none focus:border-blue-500 focus:bg-white focus:ring-2 focus:ring-blue-100"
            >
              <option value="All">All Priorities</option>
              <option value="Low">Low</option>
              <option value="Medium">Medium</option>
              <option value="High">High</option>
            </select>
          </div>

          <!-- Task Cards -->
          <div id="taskList" class="space-y-3"></div>
        </section>
      </div>
    </main>

    <script src="index.js"></script>
  </body>
</html>
